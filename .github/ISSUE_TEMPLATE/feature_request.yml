name: 功能建议
description: 提议新的用户流程、模块或平台能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先查看当前 README 和已有 Issue。大型功能应说明是否适合核心、官方扩展模块或独立项目。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 请先描述用户遇到的实际问题，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述普通用户如何进入、操作、验证和恢复。
    validations:
      required: true
  - type: dropdown
    id: location
    attributes:
      label: 建议归属
      options:
        - 核心平台
        - 内置模块
        - 官方扩展模块
        - 第三方模块
        - 独立项目
        - 不确定
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全和兼容性影响
      description: 是否修改 SSH、防火墙、用户、系统服务，是否产生流量或依赖第三方 root 代码。
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已经查看 README、现有功能和 Issue，没有发现相同建议。
          required: true
        - label: 我理解功能建议不代表一定进入下一个版本。
          required: true
