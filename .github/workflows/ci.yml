name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify ShellCheck
        run: shellcheck --version

      - name: Run test suite
        run: ./tests/run.sh

      - name: Build release bundle
        run: ./scripts/build-release.sh
